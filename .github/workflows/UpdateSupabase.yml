name: Update Supabase

on:
  schedule:
    - cron: "0 6 * * *"  # Una sola volta, alle 6 UTC (= 8 Roma in inverno, 7 Roma in estate)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependencies Installation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pipeline Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
          PIRATE_WEATHER_API_KEY: ${{ secrets.PIRATE_WEATHER_API_KEY }}
        run: |
          python src/weather/FetchProviders.py