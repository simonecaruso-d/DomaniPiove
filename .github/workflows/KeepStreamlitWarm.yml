name: Keep Streamlit Warm

on:
  schedule:
    - cron: "0 */4 * * *" 
  workflow_dispatch:

concurrency:
  group: keep-streamlit-warm
  cancel-in-progress: false

jobs:
  warm-app:
    runs-on: ubuntu-latest

    steps:
      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Open App And Wait 3 Minutes
        shell: bash
        run: |
          node -e "const { chromium } = require('playwright'); (async () => { const appUrl = 'https://domanipiove.streamlit.app/'; const browser = await chromium.launch({ headless: true }); const page = await browser.newPage(); page.setDefaultNavigationTimeout(180000); console.log('Opening app:', appUrl); await page.goto(appUrl, { waitUntil: 'networkidle' }); console.log('App opened. Keeping browser session alive for 180 seconds...'); await page.waitForTimeout(180000); await browser.close(); console.log('Warm-up completed.'); })().catch((error) => { console.error(error); process.exit(1); });"